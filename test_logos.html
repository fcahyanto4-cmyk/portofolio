<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Logo Only 1:1 Large Sharp Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px; background: #f4f4f5; color: #18181b; }
    .dark { background: #09090b; color: #fafafa; padding: 30px; border-radius: 16px; margin-top: 30px; }
    .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .icon-tile {
      width: 48px;
      height: 48px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      border: 1px solid #e4e4e7;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dark .icon-tile {
      border-color: #27272a;
      background: #18181b;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .icon-tile:hover {
      transform: translateY(-2px);
      border-color: #a1a1aa;
    }
    .dark .icon-tile:hover {
      border-color: #52525b;
    }
    .icon-tile img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1/1;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
    .label {
      font-size: 11px;
      font-family: monospace;
      color: #71717a;
      margin-bottom: 12px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h2>Test Icon-Only (No Text, 1:1 Large, Sharp)</h2>
  
  <span class="label">Light Mode (48x48px 1:1 Tiles):</span>
  <div class="flex-row">
    <div class="icon-tile" title="Power BI &amp; DAX"><img src="assets/images/logos/powerbi.svg" alt="Power BI"></div>
    <div class="icon-tile" title="Looker Studio"><img src="assets/images/logos/looker.svg" alt="Looker Studio"></div>
    <div class="icon-tile" title="SQL / PostgreSQL"><img src="assets/images/logos/postgresql.svg" alt="PostgreSQL"></div>
    <div class="icon-tile" title="Python (Pandas)"><img src="assets/images/logos/python.svg" alt="Python"></div>
    <div class="icon-tile" title="Advanced Excel"><img src="assets/images/logos/excel.svg" alt="Excel"></div>
    <div class="icon-tile" title="Canva"><img src="assets/images/logos/canva.svg" alt="Canva"></div>
    <div class="icon-tile" title="n8n Automation"><img src="assets/images/logos/n8n.svg" alt="n8n"></div>
    <div class="icon-tile" title="K-Means ML (Scikit-Learn)"><img src="assets/images/logos/scikitlearn.svg" alt="Scikit-Learn"></div>
  </div>

  <div class="dark">
    <span class="label">Dark Mode (48x48px 1:1 Tiles):</span>
    <div class="flex-row">
      <div class="icon-tile" title="Power BI &amp; DAX"><img src="assets/images/logos/powerbi.svg" alt="Power BI"></div>
      <div class="icon-tile" title="Looker Studio"><img src="assets/images/logos/looker.svg" alt="Looker Studio"></div>
      <div class="icon-tile" title="SQL / PostgreSQL"><img src="assets/images/logos/postgresql.svg" alt="PostgreSQL"></div>
      <div class="icon-tile" title="Python (Pandas)"><img src="assets/images/logos/python.svg" alt="Python"></div>
      <div class="icon-tile" title="Advanced Excel"><img src="assets/images/logos/excel.svg" alt="Excel"></div>
      <div class="icon-tile" title="Canva"><img src="assets/images/logos/canva.svg" alt="Canva"></div>
      <div class="icon-tile" title="n8n Automation"><img src="assets/images/logos/n8n.svg" alt="n8n"></div>
      <div class="icon-tile" title="K-Means ML (Scikit-Learn)"><img src="assets/images/logos/scikitlearn.svg" alt="Scikit-Learn"></div>
    </div>
  </div>
</body>
</html>
